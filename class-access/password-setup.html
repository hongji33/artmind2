<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사용 반 비밀번호 설정</title><style>body{max-width:680px;margin:45px auto;padding:20px;background:#f6f4eb;color:#354b40;font:15px system-ui}label{display:grid;gap:8px;margin:20px 0}input,button,textarea{font:inherit;padding:12px;border:1px solid #b9c5b2;border-radius:6px}textarea{width:100%;height:150px;box-sizing:border-box}p{line-height:1.8}button{background:#355948;color:white}code{overflow-wrap:anywhere}h2{font-size:17px}#result[hidden]{display:none}</style></head><body><h1>교사용 반 비밀번호 설정</h1><p>무료 Spark용 설정 도구입니다. 이 브라우저에서 해시를 만들며 비밀번호를 전송하거나 저장하지 않습니다. 교사가 Firebase 콘솔에 반마다 두 문서를 등록합니다. 같은 반의 비밀번호를 변경할 때도 새 설정을 만들어 두 문서의 값을 교체하세요.</p><form id="setup"><label>학반<input id="classId" required pattern="[1-3]-([1-9]|1[0-9]|20)" placeholder="3-1" autocomplete="off"></label><label>반 비밀번호<input id="password" type="password" minlength="4" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required autocomplete="new-password" placeholder="숫자 4자리 (예: 1111)"></label><button id="generate">설정 만들기</button></form><p id="status" role="status"></p><section id="result" hidden><h2>① 입장용 공개 설정</h2><p><code id="publicPath"></code></p><textarea id="publicOutput" readonly aria-label="공개 설정 JSON"></textarea><h2>② 관리자용 비공개 설정</h2><p><code id="privatePath"></code></p><textarea id="privateOutput" readonly aria-label="비공개 설정 JSON"></textarea><p>②의 해시는 비밀번호처럼 취급하세요. 채팅·공개 저장소에 올리지 마세요. 보안 규칙 적용 전에는 등록하지 마세요.</p><button type="button" id="clear">설정 화면 지우기</button></section><script type="module">
// Public salt parameters are safe to download. The resulting proof is a credential.
const ITERATIONS=210000;
function validClassId(value){return typeof value==='string'&&/^([1-3])-([1-9]|1\d|20)$/.test(value)}
async function derivePasswordProof(password,salt,iterations=ITERATIONS){
 if(typeof password!=='string'||!/^[0-9]{4}$/.test(password)||typeof salt!=='string'||!/^[a-f0-9]{32}$/.test(salt)||iterations!==ITERATIONS)throw Error('invalid-class-entry');
 const bytes=Uint8Array.from(salt.match(/../g),x=>parseInt(x,16));
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
 const result=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes,iterations},key,256);
 return [...new Uint8Array(result)].map(n=>n.toString(16).padStart(2,'0')).join('');
}

const $=id=>document.getElementById(id);
$('setup').onsubmit=async e=>{e.preventDefault();$('generate').disabled=true;$('result').hidden=true;
 try{const bytes=crypto.getRandomValues(new Uint8Array(16)),salt=[...bytes].map(n=>n.toString(16).padStart(2,'0')).join('');const password=$('password').value;$('password').value='';const passwordHash=await derivePasswordProof(password,salt);const classId=$('classId').value;
 $('publicPath').textContent='artmind2_class_public/'+classId;$('privatePath').textContent='artmind2_class_access/'+classId;
 $('publicOutput').value=JSON.stringify({salt,iterations:ITERATIONS},null,2);$('privateOutput').value=JSON.stringify({enabled:true,passwordHash},null,2);$('result').hidden=false;$('status').textContent='설정을 만들었습니다. 두 문서를 관리자 콘솔에 등록해 주세요.';
 }catch{$('status').textContent='설정을 만들지 못했습니다. HTTPS 환경과 입력 내용을 확인해 주세요.'}finally{$('generate').disabled=false}};
$('clear').onclick=()=>{$('result').hidden=true;$('publicOutput').value='';$('privateOutput').value='';$('status').textContent='설정 화면을 지웠습니다.'};
</script></body></html>
