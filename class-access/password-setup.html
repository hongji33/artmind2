<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사용 반 비밀번호 설정 파일</title><style>body{max-width:620px;margin:50px auto;padding:20px;background:#f6f4eb;color:#354b40;font:15px system-ui}label{display:grid;gap:8px;margin:20px 0}input,button,textarea{font:inherit;padding:12px;border:1px solid #b9c5b2;border-radius:6px}textarea{width:100%;height:220px;box-sizing:border-box}p{line-height:1.8}button{background:#355948;color:white}</style></head><body><h1>교사용 반 비밀번호 설정 파일</h1><p>이 도구는 이 브라우저 안에서 비밀번호의 해시만 생성합니다. 비밀번호를 서버로 전송하지 않습니다. 생성한 설정은 Firebase 관리자만 해당 학급 문서에 등록할 수 있습니다.</p><form id="setup"><label>학반<input id="classId" required pattern="[1-3]-([1-9]|1[0-9]|20)" placeholder="3-1"></label><label>반 비밀번호<input id="password" type="password" minlength="4" maxlength="128" required autocomplete="new-password"></label><button>설정 JSON 만들기</button></form><p id="where"></p><textarea id="output" readonly aria-label="Firebase에 등록할 설정 JSON"></textarea><script>
const hex=b=>[...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,'0')).join('');document.getElementById('setup').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('password'),salt=crypto.getRandomValues(new Uint8Array(16)),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveBits']);const hash=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:210000},key,256);document.getElementById('output').value=JSON.stringify({enabled:true,salt:hex(salt),passwordHash:hex(hash),iterations:210000},null,2);document.getElementById('where').textContent='관리자 등록 위치: artmind2_class_access/'+document.getElementById('classId').value;input.value=''};
</script></body></html>
