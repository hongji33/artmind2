<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 마음의 미술관</title><style>body{font-family:system-ui,sans-serif;background:#f7f5ee;color:#203e35;margin:0}header{background:#214c40;color:white;padding:40px 8%}main{max-width:900px;margin:auto;padding:30px 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 3px 15px #0001}button{background:#28634e;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer}input,textarea{display:block;box-sizing:border-box;width:100%;margin:10px 0;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}textarea{min-height:90px}nav{display:flex;gap:10px;flex-wrap:wrap}section{display:none}section.active{display:block}small{color:#677}</style><header><h1>우리 반 마음의 미술관</h1><p>서로 다른 마음이 모여 하나의 미술관이 되다</p><nav><button onclick="go('intro')">소개</button><button onclick="go('make')">나의 전시실</button><button onclick="go('visit')">전시 관람</button></nav></header><main><section id="intro" class="active"><h2>마음에서 시작하는 미술 감상</h2><div class="cards"><div class="card"><h3>01 감정</h3><p>오늘의 감정을 선택하고 작품을 탐색합니다.</p></div><div class="card"><h3>02 감상</h3><p>작품의 색·선·구도와 자신의 느낌을 연결합니다.</p></div><div class="card"><h3>03 전시</h3><p>한국과 서양 작품을 나만의 전시실에 소개합니다.</p></div></div><p><small>초기 체험판입니다. 데이터는 이 브라우저에만 저장되며 학급 공동 서버는 연결되지 않았습니다. 실명이나 민감한 정보를 입력하지 마세요.</small></p></section><section id="make"><h2>나의 전시실 만들기</h2><form id="form"><label>전시실 별칭<input name="nick" maxlength="30" required></label><label>전시 제목<input name="title" maxlength="80" required></label><label>오늘의 감정<input name="feeling" maxlength="40" required></label><label>전시 기획 의도<textarea name="intent" maxlength="1000" required></textarea></label><h3>한국미술 작품</h3><label>작품명<input name="kname" required></label><label>눈에 보이는 표현 특징<textarea name="klook" required></textarea></label><label>나의 해석<textarea name="kthink" required></textarea></label><h3>서양미술 작품</h3><label>작품명<input name="wname" required></label><label>눈에 보이는 표현 특징<textarea name="wlook" required></textarea></label><label>나의 해석<textarea name="wthink" required></textarea></label><button type="submit">전시실 저장</button></form></section><section id="visit"><h2>전시실 관람</h2><p><small>현재 브라우저에 저장된 전시실만 표시됩니다.</small></p><div id="list" class="cards"></div></section></main><script>function go(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id));if(id==='visit')render()}function read(){try{return JSON.parse(localStorage.getItem('artmind2-preview')||'[]')}catch{return []}}document.getElementById('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());const a=read();a.push(v);try{localStorage.setItem('artmind2-preview',JSON.stringify(a));e.target.reset();go('visit')}catch{alert('브라우저 저장에 실패했습니다.')}};function render(){const list=document.getElementById('list');list.replaceChildren();const a=read();if(!a.length){list.textContent='아직 전시실이 없습니다.';return}for(const v of a){const c=document.createElement('div');c.className='card';for(const [key,label] of [['title','전시 제목'],['nick','별칭'],['feeling','감정'],['intent','기획 의도'],['kname','한국미술'],['klook','표현 특징'],['kthink','나의 해석'],['wname','서양미술'],['wlook','표현 특징'],['wthink','나의 해석']]){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(v[key]||''));c.append(p)}list.append(c)}};</script></html>
